<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beanos Login Page</title>
    <!-- Load Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Google Fonts & FontAwesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">

    <style>
        /* Design Tokens from Beanos Style Guide */
        :root {
            --color-primary-rust:    #A65E4F;
            --color-primary-navy:    #1A2A40;
            --color-secondary-tan:   #EBD9C1;
            --color-success:         #5D9B7B;
            --color-info:            #4F8EA6;
            --color-warning:         #D9A06F;
            --color-gray-900:        #1F1F1F;
            --color-gray-700:        #4A4A4A;
            --color-gray-400:        #A3A3A3;
            --color-gray-200:        #E5E5E5;
            --color-gray-100:        #F8F8F8;
            --color-white:           #FFFFFF;

            --font-headings:         'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-body:             'Merriweather', Georgia, serif;

            --border-radius:         6px;
            --spacing-unit:          8px;
            --shadow-sm:             0 2px 4px rgba(0,0,0,0.06);
            --shadow-md:             0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg:             0 8px 24px rgba(0,0,0,0.12);
            --transition-fast:       all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            font-size: 1rem;
            color: var(--color-gray-900);
            background-color: var(--color-gray-100);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            padding: calc(4 * var(--spacing-unit)) calc(2 * var(--spacing-unit));
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        /* Hero Header styling from Beanos Style Guide */
        .hero {
            background: linear-gradient(135deg, var(--color-primary-navy) 0%, #2A3E5C 100%);
            color: var(--color-white);
            padding: calc(5 * var(--spacing-unit)) calc(3 * var(--spacing-unit));
            border-radius: calc(2 * var(--border-radius));
            margin-bottom: calc(4 * var(--spacing-unit));
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .hero::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 300px;
            height: 300px;
            background: rgba(166, 94, 79, 0.15);
            border-radius: 50%;
            pointer-events: none;
        }

        /* Beanos Brand Logo Integration */
        .guide-brand { 
            display: inline-flex; 
            align-items: center; 
            gap: 12px; 
            color: var(--color-white); 
            font: 700 2.25rem/1.2 var(--font-headings); 
            letter-spacing: -0.8px;
            margin-bottom: calc(1 * var(--spacing-unit));
            position: relative; 
            z-index: 1; 
        }
        .guide-brand-mark { 
            width: 48px; 
            height: 48px; 
            flex-shrink: 0; 
            color: var(--color-primary-navy); 
            border-radius: var(--border-radius); 
            box-shadow: 0 0 0 1px #ffffff40;
        }
        .guide-brand-dot { 
            color: var(--color-primary-rust); 
        }

        .hero p {
            font-family: var(--font-headings);
            font-weight: 300;
            color: var(--color-secondary-tan);
            font-size: 1.1rem;
            position: relative;
            z-index: 1;
        }

        .guide-section {
            background-color: var(--color-white);
            border-radius: var(--border-radius);
            padding: calc(4 * var(--spacing-unit));
            margin-bottom: calc(4 * var(--spacing-unit));
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--color-gray-200);
        }

        h2, h3 {
            font-family: var(--font-headings);
            color: var(--color-primary-navy);
            line-height: 1.3;
        }

        h2 {
            font-size: 1.75rem;
            border-bottom: 2px solid var(--color-secondary-tan);
            padding-bottom: calc(1.5 * var(--spacing-unit));
            margin-bottom: calc(3 * var(--spacing-unit));
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h2 i {
            color: var(--color-primary-rust);
            font-size: 0.9em;
        }

        h3 {
            font-size: 1.15rem;
            margin-bottom: calc(2 * var(--spacing-unit));
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: calc(2.5 * var(--spacing-unit));
        }

        label {
            display: block;
            font-family: var(--font-headings);
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--color-primary-navy);
            margin-bottom: calc(1 * var(--spacing-unit));
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px 14px;
            font-family: var(--font-body);
            font-size: 0.95rem;
            border: 1px solid var(--color-gray-400);
            border-radius: var(--border-radius);
            background-color: var(--color-white);
            transition: var(--transition-fast);
            outline: none;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: var(--color-primary-rust);
            box-shadow: 0 0 0 3px rgba(166, 94, 79, 0.15);
        }

        .button-group {
            display: flex;
            gap: calc(2 * var(--spacing-unit));
            margin-top: calc(3 * var(--spacing-unit));
        }

        .btn {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            font-family: var(--font-headings);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-radius: var(--border-radius);
            transition: var(--transition-fast);
            border: 2px solid transparent;
            cursor: pointer;
            outline: none;
        }

        .btn-primary {
            background-color: var(--color-primary-rust);
            color: var(--color-white);
        }

        .btn-primary:hover, .btn-primary:focus-visible {
            background-color: #8C4D40;
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: transparent;
            border-color: var(--color-primary-navy);
            color: var(--color-primary-navy);
        }

        .btn-secondary:hover, .btn-secondary:focus-visible {
            background-color: var(--color-primary-navy);
            color: var(--color-white);
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }

        #status-message {
            font-family: var(--font-headings);
            font-size: 0.9rem;
            font-weight: 500;
            margin-top: calc(2.5 * var(--spacing-unit));
            padding: calc(1.5 * var(--spacing-unit));
            border-radius: var(--border-radius);
            background-color: var(--color-gray-100);
            display: none;
        }

        #status-message:not(:empty) {
            display: block;
        }

        .recent-section {
            border-top: 1px dashed var(--color-gray-200);
            margin-top: calc(4 * var(--spacing-unit));
            padding-top: calc(3 * var(--spacing-unit));
        }

        #recent-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #recent-list li {
            font-family: var(--font-headings);
            font-size: 0.85rem;
            color: var(--color-gray-700);
            background-color: var(--color-gray-100);
            padding: 8px 12px;
            border-radius: var(--border-radius);
            border-left: 3px solid var(--color-secondary-tan);
        }

        @media (max-width: 480px) {
            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Beanos Header Hero Section with Official Brand Logo & Wordmark -->
        <header class="hero">
            <div class="guide-brand">
                <svg class="guide-brand-mark" viewBox="0 0 40 40" aria-hidden="true">
                    <rect width="40" height="40" rx="6" fill="currentColor"/>
                    <path d="M25 9c7 3 8 13 2 19-5 5-13 6-17 1-4-5-1-12 4-13 6-2 3-10 11-7Z" fill="#EBD9C1"/>
                    <path d="M24 13c-6 2-1 9-10 13" fill="none" stroke="#A65E4F" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span>Beanos<span class="guide-brand-dot">.</span></span>
            </div>
            <p>Helping guys get girls since 2026</p>
        </header>

        <section class="guide-section">
            <h2><i class="fa-solid fa-user-lock"></i> Account Access</h2>
            
            <form id="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <!-- Two distinct submit buttons -->
                <div class="button-group">
                    <button type="button" id="signup-btn" class="btn btn-secondary"><i class="fa-solid fa-user-plus"></i> Create Account</button>
                    <button type="button" id="login-btn" class="btn btn-primary"><i class="fa-solid fa-right-to-bracket"></i> Log In</button>
                </div>
            </form>

            <p id="status-message"></p>

            <!-- Recent sign-ups section -->
            <div class="recent-section">
                <h3><i class="fa-solid fa-users" style="color: var(--color-primary-rust);"></i> Recent sign-ups because privacy doesn't matter lol</h3>
                <ul id="recent-list">
                    <!-- Emails will be injected here -->
                </ul>
            </div>
        </section>
    </div>

 <script>
        const SUPABASE_URL = 'https://bzqepyhnvvrwzafydeqp.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_VbXs3R4Y6H4bVS63j2KkoA_g0trAUp5';

        const testDatabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const statusMessage = document.getElementById('status-message');
        const recentList = document.getElementById('recent-list');

        // Function to fetch and display the last 3 sign-ups
        async function loadRecentSignUps() {
            const { data, error } = await testDatabase
                .from('SIGN_IN')
                .select('email')
                .order('user_id', { ascending: false })
                .limit(3);

            if (error) {
                console.error("Error fetching recent signups:", error);
                return;
            }

            recentList.innerHTML = '';
            data.forEach(user => {
                const li = document.createElement('li');
                li.textContent = user.email;
                recentList.appendChild(li);
            });
        }

        // Helper to update status message UI
        function setStatus(message, color) {
            statusMessage.textContent = message;
            statusMessage.style.color = color;
        }

        // Handle Create Account
        document.getElementById('signup-btn').addEventListener('click', async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                setStatus("Please enter both email and password.", "red");
                return;
            }

            setStatus("Creating account...", "blue");

            const { data, error } = await testDatabase
                .from('SIGN_IN')
                .insert([{ email: email, password_hash: password }])
                .select(); // Ensures Supabase returns the newly created row data

            if (error) {
                if (error.code === '23505' || (error.message && error.message.toLowerCase().includes('duplicate key'))) {
                    setStatus("An account with this email already exists!", "red");
                } else {
                    setStatus(`Error: ${error.message}`, "red");
                }
                console.error("Insert error:", error);
            } else {
                setStatus('Account created successfully! Redirecting to survey...', 'green');
                
                // Pull row data returned from Supabase and save it to localStorage
                if (data && data.length > 0) {
                    const newUserRow = data[0];
                    localStorage.setItem('active_user_email', newUserRow.email);
                    localStorage.setItem('active_user_id', newUserRow.user_id || newUserRow.id || '');
                }

                emailInput.value = '';
                passwordInput.value = '';
                
                // Route the user to the survey page after a brief delay
                setTimeout(() => {
                    window.location.href = 'survey.html';
                }, 1000);
            }
        });

        // Handle Log In
        document.getElementById('login-btn').addEventListener('click', async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                setStatus("Please enter both email and password.", "red");
                return;
            }

            setStatus("Verifying credentials...", "blue");

            // Query database for matching email and password combination
            const { data, error } = await testDatabase
                .from('SIGN_IN')
                .select('user_id, email')
                .eq('email', email)
                .eq('password_hash', password);

            if (error) {
                setStatus(`Database error: ${error.message}`, 'red');
                console.error("Login query error:", error);
            } else if (data && data.length > 0) {
                setStatus(`Success! Welcome back, ${data[0].email}!`, 'green');
                
                // Save session for logging in as well
                localStorage.setItem('active_user_email', data[0].email);
                localStorage.setItem('active_user_id', data[0].user_id || '');
            } else {
                setStatus('Invalid email or password.', 'red');
            }
        });

        // Load the recent sign-ups on page load
        loadRecentSignUps();
    </script>
</body>
</html>

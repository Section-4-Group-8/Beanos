<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile — Men's Dating Mastery</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons for components -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Supabase JavaScript Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* ==========================================================================
           1. CSS Custom Properties / Design Tokens
           ========================================================================== */
        :root {
            --color-primary-rust:    #A65E4F;
            --color-primary-navy:    #1A2A40;
            --color-secondary-tan:   #EBD9C1;
            --color-success:         #5D9B7B;
            --color-info:            #4F8EA6;
            --color-warning:         #D9A06F;
            --color-gray-900:        #1F1F1F;
            --color-gray-700:        #4A4A4A;
            --color-gray-400:        #A3A3A3;
            --color-gray-200:        #E5E5E5;
            --color-gray-100:        #F8F8F8;
            --color-white:           #FFFFFF;
            --font-headings:         'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-body:             'Merriweather', Georgia, serif;
            --size-font-lg:          1.75rem;
            --size-font-sm:          1.1rem;
            --size-font-xs:          0.875rem;
            --weight-semibold:       600;
            --border-radius:         6px;
            --spacing-unit:          8px;
            --shadow-sm:             0 2px 4px rgba(0,0,0,0.06);
            --shadow-lg:             0 8px 24px rgba(0,0,0,0.12);
            --transition-fast:       all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-body);
            font-size: 1rem;
            color: var(--color-gray-900);
            background-color: var(--color-gray-100);
            line-height: 1.7;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-headings);
            color: var(--color-primary-navy);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: calc(4 * var(--spacing-unit)) calc(2 * var(--spacing-unit));
        }

        .hero {
            background: linear-gradient(135deg, var(--color-primary-navy) 0%, #2A3E5C 100%);
            color: var(--color-white);
            padding: calc(5 * var(--spacing-unit)) calc(3 * var(--spacing-unit));
            border-radius: calc(2 * var(--border-radius));
            margin-bottom: calc(4 * var(--spacing-unit));
            box-shadow: var(--shadow-lg);
        }

        .hero h1 {
            color: var(--color-white);
            font-size: var(--size-font-lg);
            margin-bottom: calc(1 * var(--spacing-unit));
        }

        .hero p {
            font-family: var(--font-headings);
            font-weight: 300;
            color: var(--color-secondary-tan);
            font-size: var(--size-font-sm);
        }

        .badge {
            display: inline-block;
            background-color: var(--color-primary-rust);
            color: var(--color-white);
            font-family: var(--font-headings);
            font-size: var(--size-font-xs);
            font-weight: var(--weight-semibold);
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .form-group { margin-bottom: calc(2 * var(--spacing-unit)); }

        .form-label {
            display: block;
            font-family: var(--font-headings);
            font-weight: var(--weight-semibold);
            font-size: 0.9rem;
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--color-gray-200);
            border-radius: var(--border-radius);
            font-family: var(--font-headings);
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition-fast);
        }

        .form-input:focus {
            border-color: var(--color-primary-rust);
            box-shadow: 0 0 0 3px rgba(166, 94, 79, 0.1);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            font-family: var(--font-headings);
            font-size: 0.85rem;
            font-weight: var(--weight-semibold);
            text-transform: uppercase;
            border-radius: var(--border-radius);
            cursor: pointer;
            border: 2px solid transparent;
            transition: var(--transition-fast);
            text-decoration: none;
        }

        .btn-primary {
            background-color: var(--color-primary-rust);
            color: var(--color-white);
        }
        .btn-primary:hover { background-color: #8C4D40; }

        .card {
            background-color: var(--color-white);
            border: 1px solid var(--color-gray-200);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            margin-bottom: calc(3 * var(--spacing-unit));
        }

        .card-header {
            background-color: var(--color-primary-navy);
            color: var(--color-white);
            padding: calc(2 * var(--spacing-unit));
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-header h3 {
            color: var(--color-white);
            font-size: 1.1rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .module-badge {
            background: var(--color-primary-rust);
            font-family: var(--font-headings);
            font-size: 0.75rem;
            padding: 3px 10px;
            border-radius: 12px;
            text-transform: uppercase;
        }

        .card-body { padding: calc(3 * var(--spacing-unit)); }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Navigation Menu -->
        <nav style="margin-bottom: 25px; display: flex; gap: 10px; font-family: var(--font-headings); font-size: 0.9rem;">
            <a href="index.html" style="color: var(--color-primary-navy); text-decoration: none; font-weight: 600;"><i class="fa-solid fa-house"></i> Home</a>
            <span style="color: var(--color-gray-400);">/</span>
            <span style="color: var(--color-primary-rust); font-weight: 600;"><i class="fa-solid fa-user"></i> Profile Settings</span>
        </nav>

        <!-- Header Hero Section -->
        <header class="hero">
            <span class="badge">Account Settings</span>
            <h1>My Dating Mastery Profile</h1>
            <p>View your active profile email, update your email address, and manage your password.</p>
        </header>

        <!-- 1. Current Profile Overview Card -->
        <div class="card">
            <div class="card-header">
                <h3><i class="fa-solid fa-id-card"></i> Current User Details</h3>
                <span class="module-badge">Active Session</span>
            </div>
            <div class="card-body">
                <div id="profile-details">
                    <p style="font-family: var(--font-headings); margin-bottom: 6px;">
                        <strong>Email Address:</strong> 
                        <span id="current-email" style="color: var(--color-primary-rust); font-weight: 600;">Loading...</span>
                    </p>
                    <p style="font-family: var(--font-headings);">
                        <strong>Database User ID:</strong> 
                        <span id="current-user-id" style="color: var(--color-gray-700);">—</span>
                    </p>
                </div>
            </div>
        </div>

        <!-- 2. Update Email Card -->
        <div class="card">
            <div class="card-header">
                <h3><i class="fa-solid fa-envelope"></i> Change Email Address</h3>
            </div>
            <div class="card-body">
                <form id="update-email-form">
                    <div class="form-group">
                        <label for="new-email" class="form-label">New Email Address:</label>
                        <input type="email" id="new-email" class="form-input" required placeholder="Enter new email address">
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-check"></i> Update Email
                    </button>
                </form>
            </div>
        </div>

        <!-- 3. Change Password Card -->
        <div class="card">
            <div class="card-header">
                <h3><i class="fa-solid fa-lock"></i> Change Password</h3>
            </div>
            <div class="card-body">
                <form id="update-password-form">
                    <div class="form-group">
                        <label for="new-password" class="form-label">New Password / Hash:</label>
                        <input type="password" id="new-password" class="form-input" required placeholder="Enter new password">
                    </div>
                    <button type="submit" class="btn btn-primary" style="background-color: var(--color-primary-navy);">
                        <i class="fa-solid fa-shield"></i> Update Password
                    </button>
                </form>
            </div>
        </div>

        <!-- Status Notification Box -->
        <div id="status-box" style="display: none; padding: 14px; border-radius: var(--border-radius); font-family: var(--font-headings); font-size: 0.9rem;"></div>

    </div>

    <!-- Script Logic -->
    <script>
        const SUPABASE_URL = 'https://bzqepyhnvvrwzafydeqp.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_VbXs3R4Y6H4bVS63j2KkoA_g0trAUp5';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Fetch user profile info from Supabase based on localStorage session
        async function fetchUserProfile() {
            const currentEmail = localStorage.getItem('active_user_email');
            
            if (!currentEmail) {
                document.getElementById('current-email').innerText = 'No active session found';
                document.getElementById('current-user-id').innerText = '—';
                return;
            }

            const { data, error } = await client
                .from('SIGN_IN')
                .select('*')
                .eq('email', currentEmail)
                .single();

            if (error) {
                console.error('Error fetching user profile:', error);
                document.getElementById('current-email').innerText = currentEmail;
                document.getElementById('current-user-id').innerText = 'Not found in DB';
            } else if (data) {
                document.getElementById('current-email').innerText = data.email;
                document.getElementById('current-user-id').innerText = data.user_id || data.id || 'N/A';
            }
        }

        // Load active user session on page load
        document.addEventListener('DOMContentLoaded', () => {
            fetchUserProfile();
        });

        // Helper to display status messages
        function showStatus(message, type) {
            const box = document.getElementById('status-box');
            box.style.display = 'block';
            box.style.backgroundColor = 'var(--color-white)';
            box.style.border = '1px solid var(--color-gray-200)';
            
            if (type === 'success') {
                box.style.borderLeft = '5px solid var(--color-success)';
                box.style.color = 'var(--color-primary-navy)';
            } else {
                box.style.borderLeft = '5px solid var(--color-primary-rust)';
                box.style.color = 'var(--color-primary-rust)';
            }
            box.innerText = message;
        }

        // 1. Handle Email Update
        document.getElementById('update-email-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const currentEmail = localStorage.getItem('active_user_email');
            const newEmail = document.getElementById('new-email').value.trim();

            if (!currentEmail) {
                alert('No active user session found. Please sign in first.');
                return;
            }

            showStatus('Updating email in database...', 'success');

            const { error } = await client
                .from('SIGN_IN')
                .update({ email: newEmail })
                .eq('email', currentEmail);

            if (error) {
                showStatus(`Error updating email: ${error.message}`, 'error');
            } else {
                localStorage.setItem('active_user_email', newEmail);
                fetchUserProfile();
                showStatus('Email successfully updated in Supabase!', 'success');
                document.getElementById('update-email-form').reset();
            }
        });

        // 2. Handle Password Update
        document.getElementById('update-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const currentEmail = localStorage.getItem('active_user_email');
            const newPassword = document.getElementById('new-password').value;

            if (!currentEmail) {
                alert('No active user session found. Please sign in first.');
                return;
            }

            showStatus('Updating password in database...', 'success');

            const { error } = await client
                .from('SIGN_IN')
                .update({ password_hash: newPassword })
                .eq('email', currentEmail);

            if (error) {
                showStatus(`Error updating password: ${error.message}`, 'error');
            } else {
                showStatus('Password successfully updated in Supabase!', 'success');
                document.getElementById('update-password-form').reset();
            }
        });
    </script>
</body>
</html>

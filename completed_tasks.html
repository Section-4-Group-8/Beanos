<!doctype html>
<html lang="en">
<head>
  <link rel="icon" href="beanos-favicon.ico" sizes="any">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Review completed Beanos tasks and reflections.">
  <title>Completed tasks | Beanos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--rust:#A65E4F;--navy:#1A2A40;--tan:#EBD9C1;--green:#5D9B7B;--ink:#1F1F1F;--muted:#4A4A4A;--line:#E5E5E5;--paper:#F8F8F8;--white:#fff;--headings:'Poppins',sans-serif;--body:'Merriweather',serif;--radius:6px}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.7 var(--body)}h1,h2,h3{font-family:var(--headings);line-height:1.3;color:var(--navy);margin-top:0}button,a{font:inherit}.skip-link{position:absolute;left:-999px;top:8px;background:#fff;padding:8px;z-index:2}.skip-link:focus{left:8px}
    .page-nav{max-width:1120px;margin:auto;padding:12px 24px;display:flex;justify-content:flex-end}.page-nav a,.page-nav button{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid #d8d5cf;border-radius:6px;background:#fff;color:var(--navy);text-decoration:none;font:600 .82rem var(--headings);cursor:pointer}.site-header{background:#fff;border-bottom:1px solid var(--line)}.header-inner{max-width:1120px;margin:auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;color:var(--navy);font:700 1.35rem var(--headings);text-decoration:none}.brand svg{width:36px;height:36px}.brand-dot{color:var(--rust)}.header-note{color:var(--muted);font:500 .84rem var(--headings)}
    main{max-width:980px;margin:auto;padding:34px 24px 60px}.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--navy),#2A3E5C);border-radius:12px;padding:36px;color:#fff;box-shadow:0 8px 24px #0002;margin-bottom:20px}.hero:after{content:"";position:absolute;width:230px;height:230px;right:-85px;top:-125px;border-radius:50%;background:#A65E4F26}.eyebrow{color:var(--tan);font:600 .75rem var(--headings);letter-spacing:1px;text-transform:uppercase}.hero h1{color:#fff;font-size:2rem;margin:8px 0}.hero p{font:400 .95rem/1.7 var(--headings);color:#f4e9dc;margin:0;max-width:680px}
    .page-actions{display:flex;justify-content:flex-end;margin:0 0 18px}.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border:1px solid transparent;border-radius:var(--radius);font:600 .82rem var(--headings);text-decoration:none;cursor:pointer}.button-primary{background:var(--rust);color:#fff}.button-primary:hover{background:#87483d}.button-secondary{background:#fff;color:var(--navy);border-color:var(--line)}.button-secondary:hover{border-color:var(--rust);color:var(--rust)}
    .status{min-height:26px;margin:12px 0;color:var(--muted);font:500 .83rem var(--headings)}.status.error{color:#9b3b32}.history-list{display:grid;gap:14px}.history-card{background:#fff;border:1px solid var(--line);border-left:4px solid var(--green);border-radius:var(--radius);padding:20px 22px;box-shadow:0 2px 4px #0000000a}.history-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.history-title{font:600 1.05rem/1.4 var(--headings);margin:0 0 8px}.history-tags{display:flex;flex-wrap:wrap;gap:7px;color:var(--rust);font:600 .72rem var(--headings)}.history-date{color:var(--muted);font:500 .75rem var(--headings);white-space:nowrap}.history-reflection{margin:14px 0;color:var(--muted);font-size:.88rem;white-space:pre-wrap}.history-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.empty-state{padding:22px;background:#fff;border:1px dashed #bbb;border-radius:var(--radius);color:var(--muted)}
    @media(max-width:600px){.header-inner{padding:12px 15px}.header-note{display:none}main{padding:22px 14px 42px}.hero{padding:27px 21px}.hero h1{font-size:1.65rem}.history-card{padding:17px}.history-head{flex-direction:column;gap:5px}.history-date{white-space:normal}.history-actions .button{width:100%}}
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to completed tasks</a>
  <nav class="page-nav" aria-label="Page navigation"><a href="tasks.html">← Back to tasks</a></nav>
  <header class="site-header"><div class="header-inner">
    <a class="brand" href="index.html" aria-label="Beanos home"><svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="6" fill="currentColor"/><path d="M25 9c7 3 8 13 2 19-5 5-13 6-17 1-4-5-1-12 4-13 6-2 3-10 11-7Z" fill="#EBD9C1"/><path d="M24 13c-6 2-1 9-10 13" fill="none" stroke="#A65E4F" stroke-width="2" stroke-linecap="round"/></svg><span>Beanos<span class="brand-dot">.</span></span></a>
    <span class="header-note">Your practice history</span>
  </div></header>
  <main id="main" tabindex="-1">
    <section class="hero"><span class="eyebrow">LOOK BACK AND TRY AGAIN</span><h1>Completed tasks</h1><p>Review each task you’ve completed, open the reflection from that attempt, or choose the task again for another try.</p></section>
    <div class="page-actions"><a class="button button-secondary" href="tasks.html">Browse available tasks <span aria-hidden="true">→</span></a></div>
    <p class="status" id="history-status" role="status" aria-live="polite">Loading your completed tasks…</p>
    <section class="history-list" id="history-list" aria-label="Your completed task attempts"></section>
  </main>
  <script src="beanos-api.js"></script>
  <script>
    'use strict';
    const statusText = document.getElementById('history-status');
    const historyList = document.getElementById('history-list');
    function dateLabel(value) {
      if (!value) return 'Completion date unavailable';
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? 'Completion date unavailable' : date.toLocaleString(undefined, { dateStyle:'medium', timeStyle:'short' });
    }
    function appendText(parent, tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      element.textContent = text || '';
      parent.appendChild(element);
      return element;
    }
    function makeCard(item) {
      const card = document.createElement('article');
      card.className = 'history-card';
      const head = document.createElement('div');
      head.className = 'history-head';
      const titleBlock = document.createElement('div');
      const difficulty = Number(item.task.difficulty) || Number(item.difficulty) || 1;
      appendText(titleBlock, 'h2', 'history-title', item.task.title || item.task.task_title || 'Completed task');
      const tags = document.createElement('div');
      tags.className = 'history-tags';
      const level = document.createElement('span');
      level.textContent = `${'★'.repeat(difficulty)}${'☆'.repeat(Math.max(0, 5 - difficulty))} · Lesson ${item.task.lesson_id || '—'}`;
      tags.appendChild(level);
      if (item.rating) {
        const rating = document.createElement('span');
        rating.textContent = `Experience: ${'★'.repeat(Number(item.rating))}${'☆'.repeat(Math.max(0, 5 - Number(item.rating)))}`;
        tags.appendChild(rating);
      }
      titleBlock.appendChild(tags);
      const date = document.createElement('time');
      date.className = 'history-date';
      date.dateTime = item.completedAt || '';
      date.textContent = dateLabel(item.completedAt);
      head.append(titleBlock, date);
      card.appendChild(head);
      const reflection = String(item.reflection || '').trim();
      appendText(card, 'p', 'history-reflection', reflection || 'No reflection is saved for this completion.');
      const actions = document.createElement('div');
      actions.className = 'history-actions';
      if (reflection) {
        const view = document.createElement('a');
        view.className = 'button button-secondary';
        const query = new URLSearchParams({ task:String(item.task.id), difficulty:String(difficulty), view:'1' });
        if (item.attemptId) query.set('attempt_id', item.attemptId);
        view.href = `reflection.html?${query.toString()}`;
        view.textContent = 'View this reflection';
        actions.appendChild(view);
      }
      const again = document.createElement('a');
      again.className = 'button button-primary';
      const redoQuery = new URLSearchParams({ task:String(item.task.id), difficulty:String(difficulty) });
      again.href = `reflection.html?${redoQuery.toString()}`;
      again.textContent = 'Do this task again';
      actions.appendChild(again);
      card.appendChild(actions);
      return card;
    }
    async function initialize() {
      try {
        const account = await window.BeanosAPI.requireAccount({ completed:true });
        if (!account) return;
        const client = window.BeanosAPI.client;
        const [attemptResult, completionResult] = await Promise.all([
          client.from('task_rating_attempts')
            .select('attempt_id,task_id,rating,reflection,rated_at')
            .eq('auth_user_id', account.authUserId)
            .order('rated_at', { ascending:false }),
          client.from('task_completions')
            .select('task_id,task_title,difficulty,completed_at')
            .eq('auth_user_id', account.authUserId)
            .eq('completed', true)
        ]);
        if (attemptResult.error) throw attemptResult.error;
        if (completionResult.error) throw completionResult.error;
        const attempts = attemptResult.data || [];
        const attemptsByTask = new Set(attempts.map(item => String(item.task_id)));
        const legacyCompletions = (completionResult.data || [])
          .filter(item => !attemptsByTask.has(String(item.task_id)))
          .map(item => ({ ...item, attempt_id:null, rating:null, reflection:null, rated_at:item.completed_at }));
        const records = [...attempts, ...legacyCompletions]
          .sort((a, b) => new Date(b.rated_at || b.completed_at || 0) - new Date(a.rated_at || a.completed_at || 0));
        if (!records.length) {
          historyList.innerHTML = '<p class="empty-state">No completed tasks yet. Finish a task and save its reflection to see it here.</p>';
          statusText.textContent = '';
          return;
        }
        const ids = [...new Set(records.map(item => Number(item.task_id)).filter(Number.isInteger))];
        const { data:taskRows, error:taskError } = await client.from('task_bank')
          .select('id,lesson_id,difficulty,title,description,estimated_minutes')
          .in('id', ids);
        if (taskError) throw taskError;
        const taskById = new Map((taskRows || []).map(task => [String(task.id), task]));
        const { data:latestReflections, error:reflectionError } = await client.from('task_reflections')
          .select('task_id,difficulty,rating,reflection,created_at')
          .eq('user_id', account.userId)
          .in('task_id', ids);
        if (reflectionError) throw reflectionError;
        const reflectionByTask = new Map((latestReflections || []).map(row => [String(row.task_id), row]));
        const cards = records.map(record => {
          const key = String(record.task_id);
          const task = taskById.get(key) || { id:record.task_id, title:record.task_title || 'Completed task', difficulty:record.difficulty || 1 };
          const latest = reflectionByTask.get(key);
          return makeCard({
            attemptId:record.attempt_id,
            completedAt:record.rated_at || record.completed_at,
            rating:record.rating || latest?.rating,
            reflection:record.reflection || latest?.reflection,
            difficulty:record.difficulty || task.difficulty,
            task
          });
        });
        historyList.replaceChildren(...cards);
        statusText.textContent = `${records.length} completed ${records.length === 1 ? 'attempt' : 'attempts'}`;
      } catch (error) {
        console.error('Could not load completed task history:', error);
        statusText.className = 'status error';
        statusText.textContent = window.BeanosAPI?.explain(error) || `Could not load completed tasks: ${error?.message || 'check Supabase access'}. Apply supabase/task_retake_history.sql if task_rating_attempts has no reflection column.`;
      }
    }
    initialize();
  </script>
</body>
</html>
